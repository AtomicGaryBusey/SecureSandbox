name: Public release

on:
  push:
    branches: [public-release]
  pull_request:
    branches: [public-release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-candidate:
    name: Exact candidate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify checkout identity
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Run publication, syntax, secret, and test gates
        run: ./scripts/run-public-release-checks.sh "$GITHUB_SHA"

  reproducible-release:
    name: Reproducible source release
    if: github.event_name == 'push'
    needs: exact-candidate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build deterministic source release
        run: python3 scripts/build-public-release.py --ref "$GITHUB_SHA" --output-dir dist
      - name: Upload release material
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SecureSandbox-source-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Attest release provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: dist/*
