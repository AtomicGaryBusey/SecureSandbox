# SecureSandbox native Research control state.  Persistent provider credentials
# are intentionally outside /run and are provisioned by the transactional
# installer; these entries contain only one-boot preparations and session data.
d /run/secure-sandbox 0755 root root -
d /run/secure-sandbox/native-codex 0700 root root -
d /run/secure-sandbox/native-codex/preparations 0700 root root -
d /run/secure-sandbox/native-codex/permits 0700 root root -
d /run/secure-sandbox/native-codex/session-state 0750 root native-codex -
d /run/secure-sandbox/native-claude 0700 root root -
d /run/secure-sandbox/native-claude/preparations 0700 root root -
d /run/secure-sandbox/native-claude/session-state 0700 root root -
