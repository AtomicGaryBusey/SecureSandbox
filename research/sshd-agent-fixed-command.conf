PermitUserRC no
PermitUserEnvironment no
StrictModes yes

Match User agent
    ForceCommand /usr/local/libexec/secure-sandbox/research_agent_ssh_entry.py
    DisableForwarding yes
    PermitTTY yes
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    X11Forwarding no
    PermitTunnel no
Match all
